{% if page.paginator.num_pages > 1 %}
<div class="pagination">
  {% if page.has_previous %}<a class="btn small" href="?{% for k,v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.previous_page_number }}">← Précédent</a>{% endif %}
  <span>Page {{ page.number }} / {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn small" href="?{% for k,v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.next_page_number }}">Suivant →</a>{% endif %}
</div>
{% endif %}
